#
# The workflows pin every third-party action to a commit SHA, so a moved tag
# cannot reach a job that holds the signing key. Dependabot rewrites SHA pins
# and keeps the tag in the comment, which is what keeps them current.
#
# Not the espos submodule: Dependabot's gitsubmodule ecosystem follows the tip
# of espOS main, not its release tags. track-espos.yml opens one PR per espOS
# release instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
