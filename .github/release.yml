#
# Categories for the release notes GitHub generates from the pull requests
# merged since the previous tag, each listed by its author with a link to it.
# release-please asks GitHub for these notes (changelog-type: github in
# release-please-config.json) and uses them for both the release and the
# CHANGELOG.md section.
#
# A pull request lands in the first category it matches, so a breaking change
# is listed once, under Breaking, and the catch-all is last.
# workflows/label-by-title.yml sets the label from the title's Conventional
# Commit type, and this file and that workflow name the same labels. A label
# set by hand places a pull request the same way until its title or
# description is edited; an unlabelled one still appears, under Other.
changelog:
  exclude:
    labels:
      - skip-changelog
      # release-please's own release PR, merged right before each tag, which
      # would otherwise list itself.
      - "autorelease: pending"
      - "autorelease: tagged"
  categories:
    - title: ⚠ Breaking changes
      labels:
        - breaking-change
    - title: Added
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Changed
      labels:
        - changed
    - title: Other
      labels:
        - "*"
